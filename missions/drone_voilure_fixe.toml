# Besoin décrit en langage simple.
# Seules les lignes marquées « obligatoire » le sont : la plateforme comble le
# reste et l'indique dans le rapport.

module = "drone-voilure-fixe"
nom = "Surveillance jour et nuit"

endurance_h = 8          # obligatoire : heures de vol
charge_utile_kg = 2.0    # obligatoire : caméra, calculateur, radio

# Y a-t-il une piste dégagée d'au moins 100 m là où le drone décollera ?
piste_disponible = "non"


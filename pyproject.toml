[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yame-yared"
version = "0.2.0"
description = "YAME / YARED : conception de matériels par simulation, du besoin au dossier de prototypage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
]

[project.optional-dependencies]
cao = ["cadquery>=2.4"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
yame = "plateforme.__main__:principal"

[tool.setuptools.packages.find]
include = ["plateforme*"]

[tool.setuptools.package-data]
plateforme = ["web/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
